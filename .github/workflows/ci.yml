name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

  reachability:
    # A capability that is not reachable from main is not shipped, however well
    # it is tested. This check exists because most of this repo's subsystems
    # were once fully tested and entirely unwired.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest

      - name: Check for new unreachable code
        run: scripts/check-deadcode.sh
