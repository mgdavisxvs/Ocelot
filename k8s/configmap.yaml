apiVersion: v1
kind: ConfigMap
metadata:
  name: ocelot-config
  labels:
    app: ocelot-tracker
data:
  tracker.conf: |
    listen_addr: :34000
    announce_interval: 1800
    peers_timeout: 7200
    max_middlemen: 10000
    num_want_limit: 50
    keepalive_timeout: 60s
    read_timeout: 10s
    write_timeout: 10s

  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'ocelot-tracker'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: ocelot-tracker
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9090
