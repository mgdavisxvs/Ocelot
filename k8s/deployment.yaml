apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocelot-tracker
  labels:
    app: ocelot-tracker
    version: v1
spec:
  # SQLite has a single writer and the volume below is ReadWriteOnce, so the
  # tracker runs one instance. Extra replicas would each get their own
  # divergent database rather than sharing load.
  replicas: 1
  strategy:
    # RollingUpdate would deadlock: the new pod cannot mount a ReadWriteOnce
    # volume still held by the old one.
    type: Recreate
  selector:
    matchLabels:
      app: ocelot-tracker
  template:
    metadata:
      labels:
        app: ocelot-tracker
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: tracker
          image: ocelot-tracker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 34000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Recognised by LoadConfig. The tracker logs a startup warning if
            # site_password is left at the placeholder.
            - name: OCELOT_SITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocelot-secrets
                  key: site-password
            - name: OCELOT_REPORT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocelot-secrets
                  key: report-password
            - name: OCELOT_METRICS_ADDR
              value: ":9090"
            - name: OCELOT_PEERS_TIMEOUT
              value: "7200"
            - name: OCELOT_REAP_PEERS_INTERVAL
              value: "1800"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          # Probes are served by the admin listener, not the tracker port,
          # which only routes /{passkey}/{action} requests.
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ocelot-data
---
apiVersion: v1
kind: Service
metadata:
  name: ocelot-tracker
  labels:
    app: ocelot-tracker
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 34000
      name: http
      protocol: TCP
    - port: 9090
      targetPort: 9090
      name: metrics
      protocol: TCP
  selector:
    app: ocelot-tracker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocelot-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
