version: '3.8'

services:
  # Ocelot Tracker (single instance: SQLite has one writer)
  tracker:
    build: .
    image: ocelot-tracker:latest
    ports:
      - "34000:34000"
      - "9090:9090"
    environment:
      # Recognised by LoadConfig; set OCELOT_SITE_PASSWORD to a real secret.
      - OCELOT_SITE_PASSWORD=${OCELOT_SITE_PASSWORD:-}
      - OCELOT_REPORT_PASSWORD=${OCELOT_REPORT_PASSWORD:-}
      - OCELOT_METRICS_ADDR=:9090
      - OCELOT_PEERS_TIMEOUT=7200
      - OCELOT_REAP_PEERS_INTERVAL=1800
    volumes:
      - tracker-data:/data
    restart: unless-stopped
    deploy:
      # SQLite has a single writer and the data volume is not shared, so more
      # than one replica means divergent databases, not more capacity.
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Nginx load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - tracker
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  tracker-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    driver: bridge
