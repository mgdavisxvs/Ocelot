events {
    worker_connections 4096;
    use epoll;
}

http {
    upstream ocelot_tracker {
        least_conn;
        server tracker:34000 max_fails=3 fail_timeout=30s;
        server tracker:34001 max_fails=3 fail_timeout=30s;
        server tracker:34002 max_fails=3 fail_timeout=30s;

        # Health checks
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=announce_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=scrape_limit:10m rate=50r/s;

    server {
        listen 80;
        server_name _;

        # Announce endpoint
        location /announce {
            limit_req zone=announce_limit burst=200 nodelay;

            proxy_pass http://ocelot_tracker;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Scrape endpoint
        location /scrape {
            limit_req zone=scrape_limit burst=100 nodelay;

            proxy_pass http://ocelot_tracker;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        # Admin API
        location ~ ^/[^/]+/(update|stats|torrents|peers|whitelist) {
            proxy_pass http://ocelot_tracker;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        # Health check
        location /health {
            access_log off;
            proxy_pass http://ocelot_tracker;
        }
    }
}
