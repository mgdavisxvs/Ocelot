global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ocelot-tracker'
    environment: 'production'

scrape_configs:
  - job_name: 'ocelot-tracker'
    static_configs:
      - targets:
          - 'tracker:9090'
        labels:
          instance: 'tracker-1'
      - targets:
          - 'tracker:9091'
        labels:
          instance: 'tracker-2'
      - targets:
          - 'tracker:9092'
        labels:
          instance: 'tracker-3'

  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis:6379'

  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres:5432'

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
